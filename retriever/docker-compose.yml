services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: mello-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO

volumes:
  qdrant_data:
    name: mello_qdrant_data
